apiVersion: v1
kind: Service
metadata:
  name: ray-swarm-nodeport
  namespace: ray
spec:
  type: NodePort
  selector:
    ray.io/cluster: ray-swarm
    ray.io/node-type: head
  ports:
    - name: client
      port: 10001
      targetPort: 10001
      nodePort: 30001   # збігається з kind extraPortMappings
    - name: dashboard
      port: 8265
      targetPort: 8265
      nodePort: 30080   # збігається з kind extraPortMappings
