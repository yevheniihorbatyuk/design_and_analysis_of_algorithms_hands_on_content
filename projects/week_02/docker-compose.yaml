version: '3.8'

services:
  osrm-backend:
    container_name: osrm_backend
    image: osrm/osrm-backend
    ports:
      - "5000:5000"
    volumes:
      - ./data/osrm_data:/data
    command: osrm-routed --algorithm mld /data/ukraine-latest.osrm
  vroom:
    container_name: vroom
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    ports:
      - "3010:3000"
    environment:
      - VROOM_ROUTER=osrm        # маршрутизатор: osrm/valhalla/ors
    volumes:
      - ./conf:/conf             # для config.yml vroom-express
    depends_on:
      - osrm-backend

volumes:
  osrm_data:
